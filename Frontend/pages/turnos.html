<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserva de Turnos | LubriCenter</title>

    <meta
      name="description"
      content="Reservá tu turno para el cambio de aceite y filtros de tu vehículo en LubriCenter."
    />
    <meta name="author" content="Agustin Francisco Delgado Ojeda" />
    <meta name="theme-color" content="#4f46e5" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-light">
    <div class="bg-dark text-white text-end py-1 px-4 small d-none d-md-block">
      Atención al cliente: 0800-LUBRI-CENTER | Envíos a todo el país
    </div>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm custom-navbar">
      <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="../index.html">
          <i class="bi bi-droplet-half"></i> LubriCenter
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto fw-medium text-uppercase small">
            <li class="nav-item">
              <a class="nav-link px-3" href="../index.html">Catálogo</a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-3" href="./aceites.html">Aceites</a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-3" href="./filtros.html">Filtros</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active px-3" href="turnos.html">Turnos</a>
            </li>
          </ul>
          <div class="d-flex text-white fs-5 gap-3">
            <i class="bi bi-search cursor-pointer"></i>
            <i class="bi bi-person-circle cursor-pointer"></i>
          </div>
        </div>
      </div>
    </nav>

    <div
      class="bg-dark text-white py-4"
      style="
        background: linear-gradient(90deg, var(--dark-blue), var(--primary));
        border-bottom: 4px solid var(--accent);
      "
    >
      <div class="container text-center">
        <h2 class="fw-bold mb-0 text-uppercase">Reserva de Turnos</h2>
        <p class="mt-2 text-white-50">
          Programá el mantenimiento de tu vehículo de forma rápida y sencilla.
        </p>
      </div>
    </div>

    <main class="container mt-5 mb-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm p-4 p-md-5">
            <h4 class="fw-bold text-dark mb-4 border-bottom pb-3">
              <i class="bi bi-calendar-check me-2 custom-text-primary"></i>Datos
              del Turno
            </h4>

            <form id="form-turno">
              <div class="row mb-3">
                <div class="col-md-6 mb-3 mb-md-0">
                  <label
                    for="clientName"
                    class="form-label small fw-bold text-muted text-uppercase"
                    >Nombre Completo</label
                  >
                  <input
                    type="text"
                    class="form-control bg-light border-0"
                    id="clientName"
                    placeholder="Ej: Juan Pérez"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label
                    for="dominio"
                    class="form-label small fw-bold text-muted text-uppercase"
                    >Patente del Vehículo</label
                  >
                  <input
                    type="text"
                    class="form-control bg-light border-0"
                    id="dominio"
                    placeholder="Ej: AB 123 CD"
                    required
                  />
                </div>
              </div>

              <div class="row mb-4">
                <div class="col-md-6 mb-3 mb-md-0">
                  <label
                    for="date"
                    class="form-label small fw-bold text-muted text-uppercase"
                    >Fecha y Hora</label
                  >
                  <input
                    type="datetime-local"
                    class="form-control bg-light border-0"
                    id="date"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label
                    for="service"
                    class="form-label small fw-bold text-muted text-uppercase"
                    >Tipo de Servicio</label
                  >
                  <select
                    class="form-select bg-light border-0"
                    id="service"
                    required
                  >
                    <option value="" selected disabled>
                      Seleccioná un servicio...
                    </option>
                    <option value="cambio_aceite">Cambio de Aceite</option>
                    <option value="cambio_filtros">Cambio de Filtros</option>
                    <option value="service_completo">Service Completo</option>
                  </select>
                </div>
              </div>

              <div id="alerta-turno" class="alert d-none" role="alert"></div>

              <div class="text-end mt-4 pt-3 border-top">
                <button
                  type="submit"
                  class="btn custom-btn px-5 py-2 fw-bold text-uppercase rounded-pill shadow-sm"
                  id="btn-submit"
                >
                  Confirmar Reserva
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white pt-5 pb-3">
      <div class="container text-center text-md-start">
        <div class="text-center small text-secondary mt-3">
          &copy; 2026 LubriCenter - Desarrollado por Agustin F. Delgado Ojeda.
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/turnos.js"></script>
  </body>
</html>
